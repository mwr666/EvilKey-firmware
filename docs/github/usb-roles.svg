<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="580" viewBox="0 0 1500 580" role="img" aria-labelledby="title desc">
  <title id="title">EvilKey USB roles</title>
  <desc id="desc">Three separately selected USB roles: FIDO with optional Manager Drive, Air Mouse, and USB Tool. One role is active at a time.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1013"/><stop offset="1" stop-color="#121c1e"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#172326"/><stop offset="1" stop-color="#10191c"/></linearGradient>
  </defs>
  <rect width="1500" height="580" rx="24" fill="url(#bg)"/>
  <path d="M44 36H1456" stroke="#66e2d0" stroke-width="2" opacity=".64"/>
  <text x="72" y="109" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="750" fill="#f5fffd">ONE DEVICE. THREE USB ROLES.</text>
  <text x="74" y="151" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#9bb4b5">One role is active at a time; the device explicitly switches between them.</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="68" y="211" width="424" height="271" rx="18" fill="url(#card)" stroke="#376d66" stroke-width="2"/>
    <rect x="538" y="211" width="424" height="271" rx="18" fill="url(#card)" stroke="#376d66" stroke-width="2"/>
    <rect x="1008" y="211" width="424" height="271" rx="18" fill="url(#card)" stroke="#376d66" stroke-width="2"/>
    <rect x="68" y="211" width="424" height="8" rx="4" fill="#7debd9"/>
    <rect x="538" y="211" width="424" height="8" rx="4" fill="#7debd9"/>
    <rect x="1008" y="211" width="424" height="8" rx="4" fill="#7debd9"/>
    <text x="96" y="279" font-size="31" font-weight="700" fill="#f4fffd">FIDO + MANAGER</text>
    <text x="96" y="323" font-size="20" fill="#91e7d8">Normal authentication role</text>
    <text x="96" y="365" font-size="18" fill="#b8cdcc">FIDO HID; optional Manager Drive</text>
    <text x="96" y="398" font-size="18" fill="#b8cdcc">when enabled on the device.</text>
    <text x="566" y="279" font-size="31" font-weight="700" fill="#f4fffd">AIR MOUSE</text>
    <text x="566" y="323" font-size="20" fill="#91e7d8">Motion pointer role</text>
    <text x="566" y="365" font-size="18" fill="#b8cdcc">Relative HID mouse only.</text>
    <text x="566" y="398" font-size="18" fill="#b8cdcc">Hold MOVE to steer.</text>
    <text x="1036" y="279" font-size="31" font-weight="700" fill="#f4fffd">USB TOOL</text>
    <text x="1036" y="323" font-size="20" fill="#91e7d8">Locally selected role</text>
    <text x="1036" y="365" font-size="18" fill="#b8cdcc">Keyboard/mouse; optional storage.</text>
    <text x="1036" y="398" font-size="18" fill="#b8cdcc">Scripts start only after RUN.</text>
  </g>
  <text x="75" y="533" font-family="Segoe UI, Arial, sans-serif" font-size="17" letter-spacing="2" fill="#72cabc">EVILKEY · WAVESHARE ESP32-S3 TOUCH AMOLED 1.64 PCB V1</text>
  <rect x="1" y="1" width="1498" height="578" rx="23" fill="none" stroke="#71d7c9" stroke-opacity=".24" stroke-width="2"/>
</svg>
